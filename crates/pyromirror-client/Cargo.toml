[package]
name = "pyromirror-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pyromirror-proto = { path = "../pyromirror-proto" }
pyromirror-net = { path = "../pyromirror-net" }
pyromirror-codec = { path = "../pyromirror-codec" }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
sdl3 = { workspace = true }

# Windows has no system SDL3 to link against, so build it from source and link it statically.
# That also keeps the release down to our own executables plus the PyroWave DLL.
[target.'cfg(windows)'.dependencies]
sdl3 = { workspace = true, features = ["build-from-source-static"] }

[features]
# Build SDL3 from source and link it statically instead of using the system's. Release builds
# for Linux use this so the viewer does not depend on the distribution shipping SDL3.
bundled-sdl = ["sdl3/build-from-source-static"]

[build-dependencies]
winresource = "0.1"
cc = "1.0"
